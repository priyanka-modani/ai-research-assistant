[project]
name = "ai-research-assistant"
version = "0.1.0"
description = "A focused Hybrid RAG assistant for market-research project knowledge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.0",
  "langchain>=1.0",
  "langchain-community>=0.4",
  "langchain-chroma>=1.0",
  "langgraph>=1.0",
  "llama-cloud>=2.8",
  "numpy>=2.0",
  "openai>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "rank-bm25>=0.2.2",
  "requests>=2.32",
  "streamlit>=1.40",
  "structlog>=24.4",
  "tenacity>=9.0",
  "tiktoken>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
